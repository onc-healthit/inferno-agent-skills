[project]
name = "inferno-agent-skills"
version = "0.1.0"
description = "Shared runtime for the Inferno agent evaluation pipeline, skills, and dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.75.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "langchain>=0.3.0,<1.0.0",
    "langchain-community>=0.3.0,<0.4.0",
    "openai>=1.0.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "streamlit>=1.40.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.uv]
default-groups = ["dev"]
